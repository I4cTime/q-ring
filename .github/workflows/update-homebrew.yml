name: Update Homebrew Tap

on:
  release:
    types: [published]
  # The tag-driven release path: release.yml dispatches this workflow on the
  # tag ref (GITHUB_TOKEN-created releases don't emit events). GITHUB_REF_NAME
  # is the tag in both paths — dispatch on a v* tag, never a branch.
  workflow_dispatch:

permissions:
  contents: read

# One formula update at a time; never cancel one mid-push.
concurrency:
  group: update-homebrew
  cancel-in-progress: false

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get release version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Wait for npm publish
        # Up to 15 minutes: npm can lag the publish by several minutes
        # (0.19.0 needed about 6, which outlasted the old 5-minute loop).
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Waiting for @i4ctime/q-ring@${VERSION} on npm..."
          for i in $(seq 1 90); do
            if npm view "@i4ctime/q-ring@${VERSION}" version 2>/dev/null; then
              echo "Found on npm!"
              exit 0
            fi
            echo "Attempt $i/90 — not yet available, waiting 10s..."
            sleep 10
          done
          echo "::error::Timed out waiting for npm publish"
          exit 1

      - name: Compute tarball sha256
        id: sha
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          URL="https://registry.npmjs.org/@i4ctime/q-ring/-/q-ring-${VERSION}.tgz"
          # -f makes a 404 fail the download instead of hashing an error page.
          curl -fsSL "$URL" -o /tmp/qring.tgz
          SHA=$(sha256sum /tmp/qring.tgz | awk '{print $1}')
          if [ -z "$SHA" ]; then
            echo "::error::Failed to compute sha256 for ${URL}"
            exit 1
          fi
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "SHA256: ${SHA}"

      - name: Clone homebrew-tap
        run: |
          git clone https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/I4cTime/homebrew-tap.git /tmp/homebrew-tap

      - name: Update formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ steps.sha.outputs.sha256 }}"
          URL="${{ steps.sha.outputs.url }}"

          cat > /tmp/homebrew-tap/Formula/qring.rb << RUBY
          class Qring < Formula
            desc "Quantum keyring for AI coding tools — secrets, superposition, entanglement, MCP"
            homepage "https://qring.i4c.studio"
            url "${URL}"
            sha256 "${SHA}"
            license "AGPL-3.0-only"

            depends_on "node@22"

            def install
              system "npm", "install", *std_npm_args
              bin.install_symlink libexec.glob("bin/*")
            end

            test do
              # \`qring --version\` prints the bare version (Commander default).
              assert_match "${VERSION}", shell_output("#{bin}/qring --version")
            end
          end
          RUBY

      - name: Commit and push
        working-directory: /tmp/homebrew-tap
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/qring.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date for ${VERSION} — nothing to push."
          else
            git commit -m "Update qring to ${VERSION}"
            git push
          fi
