name: Publish to npm & MCP Registry

on:
  release:
    # "published" (not "created") so draft releases never trigger a publish;
    # matches the trigger update-homebrew.yml already uses.
    types: [published]
  # The tag-driven release path: release.yml dispatches this workflow on the
  # tag ref. Also used to re-publish manually if a run fails — pick the tag
  # (or any branch) when dispatching from the Actions tab.
  #
  # Deliberately NOT workflow_call: npm trusted publishing validates the OIDC
  # token's top-level workflow file, and the trusted publisher on npmjs.com is
  # registered for publish.yml. A called workflow presents release.yml as the
  # top-level file and npm rejects the token with a misleading E404 (this
  # failed the first v0.13.0 run).
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to publish (defaults to the dispatched ref)"
        required: false
        type: string
      mcpb_only:
        description: "Skip npm + MCP Registry (already published) and only rebuild and re-attach the MCPB bundle"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

# Never run two publishes at once (e.g. release event + manual re-dispatch);
# don't cancel an in-flight publish either.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      # pnpm version comes from the "packageManager" field in package.json;
      # do not also pin "version" here (pnpm/action-setup errors on conflict).
      # Must run before setup-node so `cache: pnpm` can find the pnpm binary.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Node 24 bundles npm 11.5+, which is the minimum required for
          # OIDC trusted publishing on npmjs.com. Node 22 ships npm 10.x,
          # which silently fails with a misleading `E404 Not Found` when
          # the registry rejects the OIDC token (this blocked the
          # v0.10.1 publish even after the trusted publisher was
          # configured). See:
          # https://docs.npmjs.com/trusted-publishers
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      # Intentionally NOT running `npm install -g npm@latest` here:
      # on the runner image it has been observed to fail with
      # "Cannot find module 'promise-retry'" during npm's own
      # self-upgrade. Node 24's bundled npm is already >= 11.5.1, so
      # no upgrade is needed for trusted publishing or provenance.

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Publish to npm
        if: ${{ !inputs.mcpb_only }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "npm already has $NAME@$VER — skipping (idempotent re-run)."
          else
            npm publish --provenance --access public
          fi

      - name: Wait for npm to serve the new version
        # The MCP Registry validates that the npm version exists before it
        # accepts a server.json. npm publish returns before the registry
        # serves the tarball, and both v0.17.0 and v0.17.5 lost that race
        # ("version '0.17.x' was not found (status: 404)"), and 0.19.0 needed
        # about 6 minutes. Same 15-minute tolerance loop as the mcpb job and
        # update-homebrew.yml.
        if: ${{ !inputs.mcpb_only }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          for i in $(seq 1 90); do
            if npm view "$NAME@$VER" version >/dev/null 2>&1; then
              echo "npm has $NAME@$VER"
              exit 0
            fi
            echo "waiting for $NAME@$VER on npm ($i/90)..."
            sleep 10
          done
          echo "::error::npm never served $NAME@$VER — cannot register with the MCP Registry"
          exit 1

      - name: Install mcp-publisher
        if: ${{ !inputs.mcpb_only }}
        # Pinned (not `latest`) so a breaking mcp-publisher release or renamed
        # asset can't silently break the publish critical path.
        env:
          MCP_PUBLISHER_VERSION: v1.7.9
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        if: ${{ !inputs.mcpb_only }}
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        if: ${{ !inputs.mcpb_only }}
        run: ./mcp-publisher publish

  mcpb:
    # Build the MCPB bundle (installs into Claude Desktop) AFTER npm serves
    # the release and attach it to the GitHub release —
    # scripts/build-mcpb.mjs vendors the PUBLISHED npm package, not the
    # working tree. Deliberately downstream of the critical path: a failure
    # here never blocks the npm/MCP Registry publish.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the .mcpb to the GitHub release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Same tolerance pattern as update-homebrew.yml: the registry can lag
      # the publish step by several minutes (0.19.0 needed about 6).
      - name: Wait for npm to serve the new version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          echo "VER=$VER" >> "$GITHUB_ENV"
          for i in $(seq 1 90); do
            if npm view "$NAME@$VER" version >/dev/null 2>&1; then
              echo "npm has $NAME@$VER"
              exit 0
            fi
            echo "waiting for $NAME@$VER on npm ($i/90)..."
            sleep 10
          done
          echo "::error::npm never served $NAME@$VER — cannot bundle"
          exit 1

      - name: Build MCPB bundle
        run: node scripts/build-mcpb.mjs "$VER"

      - name: Attach bundle to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" "dist-mcpb/qring-$VER.mcpb" --clobber
          else
            echo "::warning::no GitHub release v$VER — skipping asset upload (manual dispatch on a non-release ref?)"
          fi
